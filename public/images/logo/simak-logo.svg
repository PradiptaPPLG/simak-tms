<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <!-- Left: The 100x100 Flat Squircle Emblem -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="100" height="100" rx="25" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 30,0 L 75,0 C 88,0 100,12 100,25" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Scaled Vector Glyph inside 100x100 -->
    <g transform="translate(0, 0) scale(0.1953125)">
      <!-- Top Segment: TMS Vibrant Crimson (#e11d48) -->
      <path d="M 368,138 L 208,138 C 152,138 110,180 110,236 C 110,270 128,300 158,316 L 216,264 C 200,256 192,244 192,232 C 192,210 210,192 232,192 L 368,192 C 380,192 390,182 390,170 L 390,160 C 390,148 380,138 368,138 Z" fill="#e11d48"/>
      <!-- Bottom Segment: Pure Tech White (#ffffff) -->
      <path d="M 144,374 L 304,374 C 360,374 402,332 402,276 C 402,242 384,212 354,196 L 296,248 C 312,256 320,268 320,280 C 320,302 302,320 280,320 L 144,320 C 132,320 122,330 122,342 L 122,352 C 122,364 132,374 144,374 Z" fill="#ffffff"/>
      <!-- Center Diagonal Origami Geometric Pivot (#9f1239) -->
      <polygon points="216,264 256,228 296,248 256,284" fill="#9f1239"/>
    </g>
  </g>

  <!-- Right Typography: Clean Flat Corporate Tech -->
  <!-- Line 1: SIMAK-TMS + PKL Badge -->
  <text x="130" y="52" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
    SIMAK<tspan fill="#e11d48">-TMS</tspan>
  </text>
  
  <!-- Pill Badge: PKL DUDI -->
  <rect x="335" y="31" width="52" height="23" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="361" y="47" text-anchor="middle" fill="#dc2626" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">PKL</text>

  <!-- Line 2: PT. TEKNOLOGI MULTI SISTEM -->
  <text x="130" y="74" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#334155" letter-spacing="0.8">
    PT. TEKNOLOGI MULTI SISTEM
  </text>

  <!-- Line 3: Subtitle / Tagline -->
  <text x="130" y="94" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">
    Sistem Informasi Manajemen Aktivitas &amp; Karya Siswa PKL
  </text>
</svg>