<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Cosmic Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="40%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Vibrant TMS Red Gradients -->
    <linearGradient id="redPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d5e"/>
      <stop offset="40%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#99000a"/>
    </linearGradient>

    <linearGradient id="redAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7582"/>
      <stop offset="50%" stop-color="#ff2b3d"/>
      <stop offset="100%" stop-color="#c4000d"/>
    </linearGradient>

    <linearGradient id="redDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8000b"/>
      <stop offset="100%" stop-color="#660005"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d5e" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e50914" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#e50914" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#e50914" flood-opacity="0.45"/>
    </filter>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ff2b3d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle Container (macOS / iOS Modern Superellipse) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Glow & Rim Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4.5"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.12"/>
  
  <!-- Ambient Center Glow Behind Glyph -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- High-End Glass Reflective Top Arc -->
  <path d="M 30,132 C 30,76 76,30 132,30 L 380,30 C 436,30 482,76 482,132 L 482,210 C 420,240 320,250 256,250 C 180,250 90,240 30,210 Z" fill="url(#glassShine)"/>

  <!-- ============================================================ -->
  <!-- CENTRAL EMBLEM: THE MODERN GEOMETRIC "S" INFINITY CODING GLYPH -->
  <!-- Combines:                                                    -->
  <!-- 1. Stylized Letter "S" (SIMAK)                               -->
  <!-- 2. Dual Interlocking Code Chevrons "<" and ">"               -->
  <!-- 3. Dynamic Forward Motion & Excellence                       -->
  <!-- ============================================================ -->
  <g filter="url(#glyphShadow)">
    
    <!-- UPPER WING: Sweeping forward bracket & upper curve of 'S' -->
    <path d="M 358,138 
             L 214,138 
             C 168,138 132,174 132,220 
             C 132,252 150,280 178,294 
             L 298,348 
             C 316,356 328,374 328,394 
             C 328,416 310,434 288,434 
             L 154,434 
             C 142,434 132,424 132,412 
             C 132,400 142,390 154,390 
             L 288,390 
             C 290,390 292,388 292,386 
             C 292,374 282,364 270,358 
             L 150,304 
             C 114,288 92,252 92,212 
             C 92,146 146,92 212,92 
             L 358,92 
             C 370,92 380,102 380,114 
             C 380,126 370,138 358,138 Z"
          fill="url(#redPrimary)"/>

    <!-- LOWER WING: Interlocking return bracket & base curve of 'S' -->
    <path d="M 154,374 
             L 298,374 
             C 344,374 380,338 380,292 
             C 380,260 362,232 334,218 
             L 214,164 
             C 196,156 184,138 184,118 
             C 184,96 202,78 224,78 
             L 358,78 
             C 370,78 380,88 380,100 
             C 380,112 370,122 358,122 
             L 224,122 
             C 222,122 220,124 220,126 
             C 220,138 230,148 242,154 
             L 362,208 
             C 398,224 420,260 420,300 
             C 420,366 366,420 300,420 
             L 154,420 
             C 142,420 132,410 132,398 
             C 132,386 142,374 154,374 Z"
          fill="url(#redAccent)"/>

    <!-- CENTER RIBBON BRIDGE: Smooth bevel blend through middle -->
    <path d="M 178,294 L 298,348 C 308,353 318,360 324,370 C 314,354 298,344 284,338 L 168,286 C 158,281 150,273 144,264 C 152,278 164,288 178,294 Z"
          fill="#ffffff" opacity="0.22"/>

    <!-- DYNAMIC CODE SLASH ACCENT (Center 45-degree Tech Cut) -->
    <polygon points="274,180 308,180 238,332 204,332" fill="#ffffff" opacity="0.95"/>

    <!-- 4-POINT STAR SPARK (Top-Right): Symbolizing 4 Pillars of DUDI Competency -->
    <path d="M 396,128 
             C 396,146 406,158 424,158 
             C 406,158 396,170 396,188 
             C 396,170 386,158 368,158 
             C 386,158 396,146 396,128 Z" 
          fill="#ffffff"/>
    <circle cx="396" cy="158" r="4.5" fill="#ff4d5e"/>

    <!-- Subtle Micro Star at Bottom-Left for Visual Balance -->
    <circle cx="116" cy="354" r="3.5" fill="#ffffff" opacity="0.75"/>

  </g>
</svg>
